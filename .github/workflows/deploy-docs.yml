name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Install Doxybook2
        run: |
          wget https://github.com/matusnovak/doxybook2/releases/download/v1.0.0/doxybook2-linux-amd64-v1.0.0.zip
          unzip doxybook2-linux-amd64-v1.0.0.zip
          sudo mv bin/doxybook2 /usr/local/bin/
          rm -rf doxybook2-linux-amd64-v1.0.0.zip bin

      - name: Generate Doxygen XML
        run: doxygen Doxyfile

      - name: Generate API Docs with Doxybook2
        run: |
          mkdir -p website/docs/api
          doxybook2 -i xml -o website/docs/api -c doxybook2.json

      - name: Install Node Dependencies
        run: npm ci
        working-directory: ./website

      - name: Build Docusaurus Site
        run: npm run build
        working-directory: ./website

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4